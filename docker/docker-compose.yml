version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: mockmate_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: mockmate_user
      POSTGRES_PASSWORD: mockmate_pass
      POSTGRES_DB: mockmate_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: mockmate_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
